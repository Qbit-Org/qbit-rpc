name: CI

# release/X.Y branches too, which RELEASING.md protects as main is, and from
# which the publish workflow releases.
on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One job per Node.js line that engines.node (^22.13.0 || ^24.0.0 ||
  # >=26.0.0) accepts, with 22.13.0 pinned exactly for the floor.
  verify-node:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.13.0
          - 22.x
          - 24.x
          - 26.x

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `version:` input: the action installs the pnpm pinned by
      # package.json `packageManager`, so CI and local corepack cannot drift.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      # check-latest: a range runs the newest release of its line, not an older
      # one the runner image has cached.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: pnpm

      - name: Check pnpm matches packageManager
        run: |
          expected="$(node -p "require('./package.json').packageManager.split('+')[0].slice('pnpm@'.length)")"
          actual="$(pnpm --version)"
          echo "node $(node --version), packageManager pnpm $expected, running pnpm $actual"
          test "$actual" = "$expected"

      # engine-strict turns pnpm's "Unsupported engine" warning into a failure,
      # so CI's Node must stay inside the root engines.node range and every
      # non-optional locked dependency's engines. zeromq's install script
      # selects its prebuilt native addon (allowed in pnpm-workspace.yaml).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=true

      # format:check, build, api:check, docs:api, test, test:release, test:scripts,
      # typecheck, typecheck:test, pack:check and consumer:check, stopping at
      # the first failure. On a release branch, or a pull request into one,
      # pack:check runs in its release mode for that branch (both packages at
      # a version of its line, ready to publish); elsewhere it keeps both
      # "private": true at 0.0.0. A back-merge into main must put them back.
      - name: Verify
        env:
          PACK_CHECK_RELEASE: ${{ startsWith(github.base_ref || github.ref_name, 'release/') && (github.base_ref || github.ref_name) || '' }}
        run: pnpm verify

  # The check to require for the matrix: it passes only when every Node.js
  # line above passed, and keeps the name the single job had before the matrix.
  verify:
    needs: verify-node
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Node.js line passed
        env:
          RESULT: ${{ needs.verify-node.result }}
        run: |
          echo "verify (node ...): $RESULT"
          test "$RESULT" = success

  # A pull request that changes a package's source (packages/*/src) must add
  # to CHANGELOG.md (scripts/check-changelog.mjs). The pull request's merge
  # commit is compared with its first parent, the tip of the branch it merges
  # into, so the check sees exactly what merging it changes.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: A source change comes with a changelog entry
        run: node scripts/check-changelog.mjs HEAD^1 HEAD

  # scripts/regtest-smoke.sh: both packages against a throwaway qbit Core
  # regtest node on 127.0.0.1, with every ZMQ topic. The release named in
  # scripts/qbit-core-release.mjs runs only after scripts/qbit-release.mjs has
  # verified SHA256SUMS against a quorum of qbit's key policy, as pinned in
  # scripts/qbit-release-keys/, and the tarball against SHA256SUMS. No path
  # filter, so it can be a required check.
  regtest-smoke:
    name: regtest smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The smoke script runs the suites with `corepack pnpm`, as CONTRIBUTING.md
      # does locally; both must be the pnpm packageManager pins.
      - name: Check pnpm matches packageManager
        run: |
          expected="$(node -p "require('./package.json').packageManager.split('+')[0].slice('pnpm@'.length)")"
          echo "node $(node --version), packageManager pnpm $expected, pnpm $(pnpm --version), corepack pnpm $(corepack pnpm --version)"
          test "$(pnpm --version)" = "$expected"
          test "$(corepack pnpm --version)" = "$expected"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=true

      # The verifier's own tests, before it is trusted with the release.
      - name: Test the release verifier
        run: pnpm test:release

      # Prints asset=, sha256=, cache-key= and signers=.
      - name: Verify SHA256SUMS against the committed release keys
        id: sums
        run: node scripts/qbit-release.mjs sums "$RUNNER_TEMP/qbit-release-sums" >> "$GITHUB_OUTPUT"

      # Keyed by the verified tarball's SHA-256, qbit-core-<version>-<os>-<arch>-<sha256>.
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/qbit-core-release
          key: ${{ steps.sums.outputs.cache-key }}

      # A restored tarball is hashed again; one without the verified digest is
      # deleted and downloaded again, once, and a failed or mismatched download
      # is final. (Cache entries cannot be overwritten: delete a bad one with
      # `gh cache delete`.) Prints bin-dir=.
      - name: Download, check and extract qbit Core
        id: core
        run: |
          node scripts/qbit-release.mjs install "$RUNNER_TEMP/qbit-release-sums" ~/.cache/qbit-core-release \
            "$RUNNER_TEMP/qbit-core" >> "$GITHUB_OUTPUT"

      # Saved as soon as it is verified, so a failing suite does not make later
      # runs download it again.
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/qbit-core-release
          key: ${{ steps.sums.outputs.cache-key }}

      - name: Regtest smoke
        env:
          QBIT_BIN_DIR: ${{ steps.core.outputs.bin-dir }}
        run: scripts/regtest-smoke.sh
