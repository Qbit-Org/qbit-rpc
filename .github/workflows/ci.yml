name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # No `version:` input: the action installs the pnpm pinned by
      # package.json `packageManager`, so CI and local corepack cannot drift.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check pnpm matches packageManager
        run: |
          expected="$(node -p "require('./package.json').packageManager.split('+')[0].slice('pnpm@'.length)")"
          actual="$(pnpm --version)"
          echo "packageManager pnpm $expected, running pnpm $actual"
          test "$actual" = "$expected"

      # engine-strict turns pnpm's "Unsupported engine" warning into a failure,
      # so CI's Node must stay inside the root engines.node range and every
      # non-optional locked dependency's engines. zeromq's install script
      # selects its prebuilt native addon (allowed in pnpm-workspace.yaml).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=true

      # format:check, build, test, typecheck, typecheck:test, pack:check and
      # consumer:check, stopping at the first failure.
      - name: Verify
        run: pnpm verify
