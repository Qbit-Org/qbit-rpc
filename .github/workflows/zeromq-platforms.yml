name: zeromq platforms

# zeromq's prebuilt addon on the arm64 platforms the CI workflow's Ubuntu
# matrix does not cover: Linux arm64 and macOS arm64. It runs on pull requests
# that can change what loads there (@qbit-oss/zmq, this workflow, the
# lockfile), weekly against the newest runner images, and by hand. It is not a
# required check, so a runner that is not available cannot block a merge.
on:
  pull_request:
    branches:
      - main
      - 'release/**'
    paths:
      - 'packages/zmq/**'
      - '.github/workflows/zeromq-platforms.yml'
      - 'pnpm-lock.yaml'
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zeromq-platforms:
    name: zeromq load (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          check-latest: true
          cache: pnpm

      - name: Check pnpm matches packageManager
        run: |
          expected="$(node -p "require('./package.json').packageManager.split('+')[0].slice('pnpm@'.length)")"
          actual="$(pnpm --version)"
          echo "node $(node --version), packageManager pnpm $expected, running pnpm $actual"
          test "$actual" = "$expected"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=true

      # zeromq's loader picks a prebuild by platform, arch and libc; it is a
      # Node-API addon, so one Node.js version stands for the others.
      - name: Load zeromq and create a Subscriber
        working-directory: packages/zmq
        run: |
          node -e "
            const zmq = require('zeromq')
            const socket = new zmq.Subscriber()
            console.log('libzmq', zmq.version, 'on', process.platform, process.arch, 'node', process.version)
            socket.close()
          "

      # Packs both packages and loads their CommonJS and ESM builds, each of
      # which creates a zeromq Subscriber.
      - name: Packed consumer check
        run: pnpm consumer:check
